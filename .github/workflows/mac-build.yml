# Builds an unsigned macOS app (.dmg + .zip, arm64 + x64) on a GitHub-hosted macOS runner.
# The Windows dev machine cannot produce macOS binaries, so this runs the pack there instead.
#
# Personal build: no Apple Developer certificate is used. The app is ad-hoc signed
# (scripts/mac-adhoc-sign.cjs, without it an Apple Silicon Mac says the app "is damaged") but NOT
# notarized, so on first launch macOS Gatekeeper asks: open with right-click > 열기 (Open), or run
#   xattr -dr com.apple.quarantine "/Applications/ezShell.app"
# The macOS app does not update itself (Squirrel.Mac needs a signed app). It looks at the latest
# release and, once the .dmg for its architecture is attached there, sends the user to that page
# (src/manualUpdate.js). So this workflow attaches the files to the release.
#
# - A release is published (the Windows deploy does that): build, then attach to that release.
# - Run workflow (Actions tab): build only, files are kept as a workflow artifact. With a release
#   tag given (v2.19.0), the files are also attached to that release (for a release whose build failed).

name: macOS build (unsigned)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the files to (empty: build only)'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-mac:
    # The newest image GitHub offers: a pinned one (macos-14) was retired and the job could not start
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # From Electron 42 the npm package no longer downloads the binary when it is installed
      - name: Download the Electron binary
        run: npx install-electron --no

      - name: Build macOS app (dmg + zip, unsigned)
        run: npm run build:mac -- --publish never
        env:
          # Do not pick up any signing identity from the runner keychain: this is an unsigned build.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ezshell-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        run: gh release upload "$TAG" release/*.dmg release/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
