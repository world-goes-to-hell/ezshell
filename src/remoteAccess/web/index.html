<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#16181c">
  <meta name="robots" content="noindex">
  <title>ezShell</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Sign in: the authenticator's code (after registering, when the address carried a one-time code) -->
  <main id="view-signin" class="view" hidden>
    <h1>ezShell</h1>
    <p id="signin-note" class="note">인증 앱의 6자리 코드를 입력하세요.</p>
    <form id="signin-form" autocomplete="off">
      <input id="signin-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" aria-label="인증 코드" required>
      <button type="submit" class="primary">접속</button>
    </form>
    <p id="signin-error" class="error" role="alert" hidden></p>
  </main>

  <!-- A message with nothing to do but read it (not registered, connection lost) -->
  <main id="view-message" class="view" hidden>
    <h1>ezShell</h1>
    <p id="message-text" class="note"></p>
    <button id="message-retry" type="button" class="primary" hidden>다시 접속</button>
  </main>

  <!-- Saved sessions, as the PC sidebar shows them -->
  <main id="view-sessions" class="view tabbed-view" hidden>
    <header class="bar">
      <strong>세션</strong>
      <span id="device-name" class="muted"></span>
      <button id="push-toggle" type="button" class="chip" aria-pressed="false" hidden>알림 켜기</button>
      <button id="sessions-refresh" type="button" class="ghost icon" aria-label="세션 목록 새로 받기">↻</button>
    </header>
    <p id="push-status" class="muted" role="status" hidden></p>
    <input id="session-filter" type="search" placeholder="세션 이름으로 찾기" aria-label="세션 찾기">
    <div id="session-list" class="list tree"></div>
  </main>

  <!-- MCP activity: requests and what they printed -->
  <main id="view-activity" class="view tabbed-view" hidden>
    <header class="bar">
      <strong>MCP 활동</strong>
      <span class="muted">이 화면을 보는 동안만 받습니다</span>
    </header>
    <div id="activity-list" class="list activity" aria-live="polite"></div>
  </main>

  <nav id="tabs" class="tabs" aria-label="화면" hidden>
    <button type="button" data-view="sessions" aria-current="page">세션</button>
    <button type="button" data-view="activity">MCP 활동</button>
  </nav>

  <!-- One terminal -->
  <main id="view-terminal" class="view terminal-view" hidden>
    <header class="bar">
      <button id="terminal-back" type="button" class="ghost" aria-label="세션 목록으로">‹ 목록</button>
      <strong id="terminal-name"></strong>
      <span id="terminal-state" class="muted"></span>
    </header>
    <div id="terminal-host"></div>
    <div id="keys" class="keys" role="toolbar" aria-label="추가 키">
      <button type="button" data-key="esc">Esc</button>
      <button type="button" data-key="tab">Tab</button>
      <button type="button" data-key="ctrl" aria-pressed="false">Ctrl</button>
      <button type="button" data-key="up" aria-label="위">↑</button>
      <button type="button" data-key="down" aria-label="아래">↓</button>
      <button type="button" data-key="left" aria-label="왼쪽">←</button>
      <button type="button" data-key="right" aria-label="오른쪽">→</button>
      <button type="button" data-text="|">|</button>
      <button type="button" data-text="/">/</button>
      <button type="button" data-text="-">-</button>
      <button type="button" data-text="~">~</button>
    </div>
  </main>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit.js"></script>
  <script src="/sessions.js"></script>
  <script src="/approvals.js"></script>
  <script src="/activity.js"></script>
  <script src="/push.js"></script>
  <script src="/app.js"></script>
</body>
</html>
